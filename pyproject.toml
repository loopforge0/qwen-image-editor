[project]
name = "qwen-image-editor"
version = "0.0.2"
description = "Point-and-say image editing with Qwen-Image-2.1-Turbo, running locally, inside your AI chat app."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    # NVIDIA (Windows, Linux): PyTorch CUDA 13.0 build with comfy-kitchen's INT8 kernels
    "torch==2.11.0; sys_platform != 'darwin'",
    "torchvision==0.26.0; sys_platform != 'darwin'",
    "comfy-kitchen==0.2.35; sys_platform != 'darwin'",
    "triton-windows; sys_platform == 'win32'",
    # Apple Silicon: MLX through mflux (brings its own PyTorch for weight conversion)
    "mflux==0.22.0; sys_platform == 'darwin'",
    "diffusers",
    "transformers>=5.17.0",
    "accelerate",
    "safetensors",
    "pillow",
    "huggingface_hub>=1.0",
    # MCP server for chat apps (Claude Desktop, Goose, ...), with MCP Apps widgets
    "mcp>=2.3,<3",
    "pyyaml>=6",  # Goose's settings file (qie connect)
    # Tray (Windows) / menu-bar (macOS) icon
    "pystray>=0.19.5; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.scripts]
qie = "qie_engine.cli:main"

[project.gui-scripts]
qie-tray = "qie_engine.tray:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/qie_engine"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]
# Qwen-Image-2.1 support is only on diffusers' main branch so far. A pinned commit as a zip needs no git.
diffusers = { url = "https://github.com/huggingface/diffusers/archive/85c9fa4caee33d1c5b473395784471d2d7957c1b.zip" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
