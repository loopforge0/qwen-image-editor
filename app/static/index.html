<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen Image Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='7' fill='%23ececee'/%3E%3Ccircle cx='20' cy='12' r='3.5' fill='%23111'/%3E%3Cpath d='M7 24l7-8 5 5 3-3 4 6z' fill='%23111'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7" fill="currentColor"/><circle cx="20" cy="12" r="3.5" fill="var(--bg)"/><path d="M7 24l7-8 5 5 3-3 4 6z" fill="var(--bg)"/></svg>
    <span>Qwen Image Editor</span>
  </div>
  <div class="status" id="status" title=""><span class="dot"></span><span id="statusText">Loading model…</span></div>
  <div class="popover-anchor">
    <button class="btn small ghost" id="chatAppsBtn" title="Use the editor from Claude Desktop or Goose">Chat apps</button>
    <div class="popover chatapps" id="chatApps" hidden></div>
  </div>
  <button class="btn small ghost" id="quit" title="Stop the editor and free the graphics memory">Quit</button>
</header>

<div class="setup" id="setup" hidden></div>

<div class="workspace">
  <section class="stagecol">
    <div class="canvas" id="canvas">
      <div class="floatbar" id="floatbar" hidden></div>
      <div class="canvas-body" id="canvasBody"></div>
      <div class="progress" id="progress" hidden>
        <div class="progress-panel">
          <div class="progress-title"><span id="progTitle">Starting</span><span class="progress-time" id="progTime"></span></div>
          <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
          <div class="progress-stages" id="progStages"></div>
        </div>
      </div>
    </div>

    <div class="composer" id="composer">
      <div class="attachments" id="attachments"></div>
      <textarea id="prompt" rows="2" placeholder="Describe an image to create…"></textarea>
      <div class="composer-row">
        <button class="btn ghost" id="addImage" title="Add a reference image (or drop / paste one)"></button>
        <div class="popover-anchor">
          <button class="btn ghost" id="optionsBtn"></button>
          <div class="popover options" id="options" hidden>
            <label class="field">
              <span>Size</span>
              <select id="optSize">
                <option value="auto">Auto — matches the last image</option>
                <option value="1024x1024">Square · 1024 × 1024</option>
                <option value="1184x896">Landscape 4:3 · 1184 × 896</option>
                <option value="1248x832">Landscape 3:2 · 1248 × 832</option>
                <option value="1344x768">Wide 16:9 · 1344 × 768</option>
                <option value="896x1184">Portrait 3:4 · 896 × 1184</option>
                <option value="832x1248">Portrait 2:3 · 832 × 1248</option>
                <option value="768x1344">Tall 9:16 · 768 × 1344</option>
                <option value="custom">Custom…</option>
              </select>
            </label>
            <div class="field-row" id="optCustom" hidden>
              <input type="number" id="optW" step="32" min="256"> <span>×</span> <input type="number" id="optH" step="32" min="256">
            </div>
            <p class="note warn" id="optSizeWarn" hidden>Above about 1.3 megapixels a 12 GB card runs out of memory while decoding, which makes it very slow.</p>
            <label class="field">
              <span>Seed</span>
              <input type="number" id="optSeed" placeholder="Random">
            </label>
            <p class="note">Leave empty for a new result each time. The same seed and inputs give the same image.</p>
            <label class="check"><input type="checkbox" id="optHideMarks"> Keep marks out of the result</label>
            <label class="check"><input type="checkbox" id="optKv"> Cache reference images between steps <span class="muted">(faster, more VRAM)</span></label>
          </div>
        </div>
        <span class="spacer"></span>
        <span class="hint" id="composerHint"></span>
        <button class="btn primary" id="generate" disabled>Generate</button>
      </div>
      <div class="error" id="error" hidden></div>
    </div>
  </section>

  <aside class="history">
    <div class="history-head"><span>History <span class="muted" id="historyCount"></span></span><span id="historyActions"></span></div>
    <div class="history-list" id="historyList"></div>
  </aside>
</div>

<input type="file" id="file" accept="image/*" multiple hidden>
<div class="dropveil" id="dropveil"><div>Drop to add as a reference image</div></div>
<script src="/static/app.js"></script>
</body>
</html>
